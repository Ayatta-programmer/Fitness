# ============================================
# FitPulse - Render Blueprint Configuration
# ============================================

databases:
  - name: fitpulse-db
    plan: free
    databaseName: fitness_gym
    user: fitpulse_user

services:
  - type: web
    name: fitpulse
    runtime: docker
    plan: free
    dockerCommand: apache2-foreground
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: fitpulse-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: fitpulse-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: fitpulse-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: fitpulse-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: fitpulse-db
          property: password
      - key: DATABASE_URL
        fromDatabase:
          name: fitpulse-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: APP_URL
        sync: false
